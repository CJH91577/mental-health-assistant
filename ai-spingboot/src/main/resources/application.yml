spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: ${MYSQL_PASSWORD:123456}  # 本机数据库密码请通过环境变量 MYSQL_PASSWORD 配置，不要提交到仓库

  ai:
    openai:
      chat:
        options:
          model: ${AI_MODEL:${SILICONFLOW_MODEL:deepseek-ai/DeepSeek-V3}}  # 模型名：环境变量 AI_MODEL 或 SILICONFLOW_MODEL 可覆盖
          tool-calling:
            enabled: true
        completions-path: /v1/chat/completions
      api-key: ${AI_API_KEY:${SILICONFLOW_API_KEY:you-key}}  # AI Key：环境变量 AI_API_KEY 或 SILICONFLOW_API_KEY 可覆盖
      base-url: ${AI_BASE_URL:https://api.siliconflow.cn}  # 接口地址：默认硅基流动；DeepSeek 官方填 https://api.deepseek.com
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# 服务器配置
server:
  port: 1235

# 文件上传存储目录（相对项目根目录）
file:
  upload-dir: uploads

# JWT配置
jwt:
  secret: ${JWT_SECRET:MySecretKeyForJWT2025!@#$%^&*()_+SecureKeyHere}  # 生产环境请通过环境变量 JWT_SECRET 覆盖
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: token  # token头部名称（与前端 request.js 保持一致）
  token-prefix: ""  # token前缀
